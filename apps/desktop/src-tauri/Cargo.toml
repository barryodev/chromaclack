[package]
name = "desktop"
description = "Tauri v2 shell for desktop and mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Tauri CLI builds this target; the cdylib is what Android/iOS link
# against, the bin is the desktop entrypoint. Both call into `run()`.
[lib]
name = "desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shared_utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }

# NOTE: no [profile] block here on purpose — Cargo only honours profiles in
# the workspace root manifest (../../../Cargo.toml).
