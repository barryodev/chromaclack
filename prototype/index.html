<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Clacker prototype</title>
		<link rel="stylesheet" href="clacker.css" />
		<script src="clacker.js" defer></script>
	</head>
	<body>
		<main>
			<section class="workspace" aria-label="Movement modes">
				<nav class="tabs" role="tablist" aria-label="Select movement mode">
					<button type="button" role="tab" data-mode="vertical" aria-selected="true">Up / Down</button>
					<button type="button" role="tab" data-mode="horizontal" aria-selected="false">
						Left / Right
					</button>
					<button type="button" role="tab" data-mode="spin" aria-selected="false">Hold &amp; Spin</button>
				</nav>

				<div class="stage">
					<!--
						clacker.js builds the flaps inside this button (see the comment above
						`flaps` there). To inspect or tweak them, select .clacker in DevTools.
						Flaps are tagged data-tier or data-offstage.

						Adjustable live in clacker.css: perspective, size, borders and radius.
						Owned by clacker.js and overwritten on the next render: --drawn-angle
						(from hinge angle and rest tilt), --lift, --spin-angle and hidden.
						Change those through the JS constants such as REST_TILTS and SEAT_SWING_MS.
					-->
					<button
						type="button"
						class="clacker"
						data-mode="vertical"
						data-axis="vertical"
						aria-label="Swipe up or down"
					></button>
				</div>
			</section>
		</main>

		<aside class="debug" aria-label="Debug readout" hidden>
			<dl>
				<div><dt>Mode</dt><dd data-debug="mode"></dd></div>
				<div><dt>Phase</dt><dd data-debug="phase"></dd></div>
				<div><dt>Current page</dt><dd data-debug="current"></dd></div>
				<div><dt>Shown page</dt><dd data-debug="shown"></dd></div>
				<div><dt>Travel / target</dt><dd data-debug="travel"></dd></div>
				<div><dt>Hinge angle</dt><dd data-debug="angle"></dd></div>
				<div><dt>Velocity</dt><dd data-debug="velocity"></dd></div>
				<div><dt>Tick looseness</dt><dd data-debug="looseness"></dd></div>
				<div><dt>Release speed</dt><dd data-debug="releaseSpeed"></dd></div>
				<div><dt>Ticks</dt><dd data-debug="ticks"></dd></div>
				<div><dt>Spin angle</dt><dd data-debug="spin"></dd></div>
				<div class="debug-wide">
					<dt>Slow-mo (press S to toggle)</dt>
					<dd>
						<label class="debug-toggle">
							<input type="checkbox" data-debug-control="slow-mo" />
							<span data-debug="slowMo"></span>
						</label>
					</dd>
				</div>
			</dl>
		</aside>
	</body>
</html>
