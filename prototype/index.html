<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Clacker prototype</title>
		<link rel="stylesheet" href="clacker.css" />
		<script type="module" src="app.js"></script>
	</head>
	<body>
		<main>
			<section class="workspace" aria-label="Movement modes">
				<nav class="tabs" role="tablist" aria-label="Select movement mode">
					<button type="button" role="tab" data-mode="vertical" aria-selected="true">Up / Down</button>
					<button type="button" role="tab" data-mode="horizontal" aria-selected="false">
						Left / Right
					</button>
					<button type="button" role="tab" data-mode="spin" aria-selected="false">Spin</button>
				</nav>

				<div class="stage">
					<!--
						clacker.js builds the flaps inside this button (see the comment above
						`flaps` there). To inspect or tweak them, select .clacker in DevTools.
						Flaps are tagged data-tier or data-offstage.

						Adjustable live in clacker.css: perspective, size, borders and radius.
						Owned by clacker.js and overwritten on the next render: --drawn-angle
						(from hinge angle and rest tilt), --lift, --spin-angle and hidden.
						Change those through the tuning constants in clacker.js and the modules it
						imports, such as REST_TILTS in clacker.js and SEAT_SWING_MS in spin.js.
					-->
					<button
						type="button"
						class="clacker"
						data-mode="vertical"
						data-axis="vertical"
						aria-label="Swipe up or down"
					></button>
				</div>

				<!--
					The mixed colour as numbers, filled by paintReadout in app.js. Each value is a button that
					copies its own text.
				-->
				<section class="readout" aria-label="Colour values">
					<p class="readout-line">
						<button type="button" class="readout-value" data-value="hsl"></button>
					</p>
					<p class="readout-line">
						<button type="button" class="readout-value" data-value="rgb"></button>
						<button type="button" class="readout-value" data-value="hex"></button>
					</p>
					<!-- Says whether a copy worked. app.js shows it briefly. -->
					<p class="readout-note" aria-live="polite">
						<svg
							class="readout-note-icon"
							viewBox="0 0 24 24"
							aria-hidden="true"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<rect x="8" y="2" width="8" height="4" rx="1" />
							<path
								d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
							/>
							<path d="m9 14 2 2 4-4" />
						</svg>
						<span class="readout-note-text"></span>
					</p>
				</section>
			</section>
		</main>

		<aside class="debug" aria-label="Debug panel" hidden>
			<dl>
				<div><dt>Mode</dt><dd data-debug="mode"></dd></div>
				<div><dt>Phase</dt><dd data-debug="phase"></dd></div>
				<div><dt>Current page</dt><dd data-debug="current"></dd></div>
				<div><dt>Shown page</dt><dd data-debug="shown"></dd></div>
				<div><dt>Last shown event</dt><dd data-debug="shownEvent"></dd></div>
				<div><dt>Last current event</dt><dd data-debug="currentEvent"></dd></div>
				<div><dt>Travel / target</dt><dd data-debug="travel"></dd></div>
				<div><dt>Hinge angle</dt><dd data-debug="angle"></dd></div>
				<div><dt>Velocity</dt><dd data-debug="velocity"></dd></div>
				<div><dt>Tick looseness</dt><dd data-debug="looseness"></dd></div>
				<div><dt>Release speed</dt><dd data-debug="releaseSpeed"></dd></div>
				<div><dt>Ticks</dt><dd data-debug="ticks"></dd></div>
				<div><dt>Spin angle</dt><dd data-debug="spin"></dd></div>
				<div><dt>Spin velocity</dt><dd data-debug="spinVelocity"></dd></div>
				<div class="debug-wide">
					<dt>Readout place (temporary, DAI-62)</dt>
					<dd>
						<label class="debug-toggle">
							<input type="checkbox" data-debug-control="readout-above" />
							<span>Above the tabs</span>
						</label>
					</dd>
				</div>
				<div class="debug-wide">
					<dt>Slow-mo (press S to toggle)</dt>
					<dd>
						<label class="debug-toggle">
							<input type="checkbox" data-debug-control="slow-mo" />
							<span data-debug="slowMo"></span>
						</label>
					</dd>
				</div>
			</dl>
		</aside>
	</body>
</html>
