[package]
name = "shared_utils"
description = "Business logic shared by the Tauri backend and the Vercel functions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
# Intentionally dependency-free: this crate must compile for desktop,
# Android/iOS and the Vercel Linux function target without any cfg gymnastics.
